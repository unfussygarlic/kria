<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#D4FF00] text-black flex items-center justify-center font-bold text-sm ring-4 ring-[#0e0e0e]">1</div>

</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#D4FF00] text-black flex items-center justify-center font-bold text-sm ring-4 ring-[#0e0e0e]">2</div>
<span class="font-label-sm text-on-surface uppercase tracking-widest">Basic Info</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-[#131313] text-neutral-500 border border-white/10 flex items-center justify-center font-bold text-sm ring-4 ring-[#0e0e0e]">3</div>

</div>

<span class="font-label-sm text-neutral-500 uppercase tracking-widest">Review</span>
</div>

<span class="text-xs font-label-md text-[#D4FF00]">REQUIRED</span>
</div>
<!-- Bento Grid for Categories -->
<div class="grid grid-cols-2 sm:grid-cols-3 gap-base">
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🏨</span>
<span class="font-label-sm uppercase text-neutral-400">Hospitality</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">

<span class="font-label-sm uppercase text-neutral-400">Retail</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border-2 border-[#D4FF00] shadow-[0_0_15px_rgba(212,255,0,0.1)] group">
<span class="text-2xl group-hover:scale-110 transition-transform">🎪</span>
<span class="font-label-sm uppercase text-[#D4FF00]">Events</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🚚</span>
<span class="font-label-sm uppercase text-neutral-400">Logistics</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🛠️</span>
<span class="font-label-sm uppercase text-neutral-400">Maintenance</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">💻</span>
<span class="font-label-sm uppercase text-neutral-400">Tech Support</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🎨</span>
<span class="font-label-sm uppercase text-neutral-400">Design</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🍳</span>
<span class="font-label-sm uppercase text-neutral-400">Kitchen</span>

<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">

<span class="font-label-sm uppercase text-neutral-400">Cleaning</span>

<span class="font-label-sm uppercase text-neutral-400">Security</span>

<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">📞</span>
<span class="font-label-sm uppercase text-neutral-400">Support</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🏢</span>
<span class="font-label-sm uppercase text-neutral-400">Office</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">

<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-xl bg-[#131313] border border-white/10 hover:border-[#D4FF00]/50 transition-all group">
<span class="text-2xl group-hover:scale-110 transition-transform">🩺</span>

</button>

<form class="space-y-6">

<div class="space-y-2">
<label class="font-label-md uppercase text-neutral-500 block">Gig Title</label>
<input class="w-full bg-[#201f1f] border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-[#D4FF00] transition-colors placeholder:text-neutral-600" placeholder="e.g. Lead Coordinator for Tech Summit" type="text"/>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="font-label-md uppercase text-neutral-500 block">Description</label>
<textarea class="w-full bg-[#201f1f] border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-[#D4FF00] transition-colors placeholder:text-neutral-600 resize-none" placeholder="Detail the responsibilities and requirements..." rows="4"></textarea>
</div>
<!-- Row: Slots & Pay Type -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md uppercase text-neutral-500 block">Available Slots</label>
<input class="w-full bg-[#201f1f] border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-[#D4FF00] transition-colors" min="1" type="number" value="1"/>
</div>
<div class="space-y-2">
<label class="font-label-md uppercase text-neutral-500 block">Pay Type</label>
<div class="flex p-1 bg-[#201f1f] rounded-lg border border-white/10">
<button class="flex-1 py-2 font-label-sm uppercase text-[#D4FF00] bg-white/5 rounded-md" type="button">Fixed</button>
<button class="flex-1 py-2 font-label-sm uppercase text-neutral-500 hover:text-white" type="button">Hourly</button>
<button class="flex-1 py-2 font-label-sm uppercase text-neutral-500 hover:text-white" type="button">Per Day</button>
</div>
</div>
</div>
<!-- Pay Amount -->
<div class="space-y-2">
<label class="font-label-md uppercase text-neutral-500 block">Pay Amount (₹)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-[#D4FF00] font-bold">₹</span>
<input class="w-full bg-[#201f1f] border border-white/10 rounded-lg pl-10 pr-4 py-3 text-on-surface focus:outline-none focus:border-[#D4FF00] transition-colors placeholder:text-neutral-600" placeholder="5,000" type="text"/>
</div>
</div>
</form>

<div class="flex items-center gap-4 pt-4">
<button class="flex-1 py-4 px-6 border border-white/10 text-white font-label-md uppercase tracking-widest hover:bg-white/5 transition-colors active:scale-95 rounded-lg">Save Draft</button>
<button class="flex-1 py-4 px-6 bg-[#D4FF00] text-black font-label-md uppercase tracking-widest hover:brightness-110 transition-all active:scale-95 rounded-lg shadow-[0_4px_20px_rgba(212,255,0,0.2)]">Next Step</button>
</div>
</div>
<!-- Decorative Element / Hint -->
<div class="mt-6 p-4 border border-dashed border-white/10 rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-[#D4FF00]" data-icon="info">info</span>
