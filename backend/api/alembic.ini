[alembic]
# Location of migration scripts (relative to this file / WORKDIR in Docker)
script_location = alembic

# sqlalchemy.url is set programmatically in alembic/env.py via DATABASE_URL env var.
# This placeholder prevents alembic from complaining if it's not set here.
sqlalchemy.url = postgresql://placeholder

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
