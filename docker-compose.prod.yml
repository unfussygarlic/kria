# Kria — Production Compose
#
# Standalone (does NOT extend docker-compose.yml).
# Runs on a single EC2 t3a.medium.
#
# Usage: bash infra/deploy.sh   (handles --env-file flag automatically)
#
# Required env file: .env.prod (never commit this)
#   SUPABASE_URL=https://<ref>.supabase.co
#   SUPABASE_SERVICE_KEY=sb_secret_...
#   SUPABASE_JWT_SECRET=...
#   DATABASE_URL=postgresql+asyncpg://postgres:<password>@db.<ref>.supabase.co:5432/postgres
#   GOOGLE_MAPS_API_KEY=...
#   ENVIRONMENT=production
#   ANTISPOOF_MODEL_ENABLED=False   # flip to True after validating with real selfies

services:

  # ── FastAPI ────────────────────────────────────────────────────────────────
  kria-api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: kria-api
    restart: always
    env_file: .env.prod
    environment:
      INSPECTOR_URL: http://inspector:8000
    ports:
      - "8000:8000"
    depends_on:
      inspector:
        condition: service_started   # Inspector warms up slowly; API returns 503 until ready
    networks:
      - kria-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Inspector (ID verification pipeline) ──────────────────────────────────
  inspector:
    build:
      context: ./perceptrons/inspector
      dockerfile: Dockerfile
    container_name: inspector
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      INSIGHTFACE_MODEL: buffalo_sc
      MATCH_THRESHOLD: "0.35"
      MIN_FACE_SIZE_PX: "50"
      MAX_IMAGE_LONG_SIDE: "1920"
      UPLOAD_DIR: /tmp/inspector_uploads
      ANTISPOOF_MODEL_ENABLED: ${ANTISPOOF_MODEL_ENABLED:-False}
    volumes:
      - insightface_models:/root/.insightface   # persists ~300MB model weights across restarts
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # first boot downloads model weights (~60s)
    networks:
      - kria-network

networks:
  kria-network:
    driver: bridge

volumes:
  insightface_models:
