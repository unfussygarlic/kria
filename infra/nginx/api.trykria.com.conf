# /etc/nginx/sites-available/api.trykria.com
#
# Step 1: Copy this file, enable it, reload nginx, then run certbot.
# Step 2: Certbot adds ssl_certificate lines and an HTTP→HTTPS redirect block automatically.
#
# Install:
#   sudo cp api.trykria.com.conf /etc/nginx/sites-available/api.trykria.com
#   sudo ln -s /etc/nginx/sites-available/api.trykria.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.trykria.com
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limit zone — 20 req/sec per IP, 10 MB state storage (~160k IPs)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name api.trykria.com;

    # Rate limiting — allow burst of 50, then 20/s hard limit
    limit_req zone=api_limit burst=50 nodelay;
    limit_req_status 429;

    # Max request body (ID images can be ~2MB each, selfie ~1MB — 10MB headroom)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Security headers
        add_header X-Content-Type-Options  "nosniff"          always;
        add_header X-Frame-Options         "DENY"             always;
        add_header Referrer-Policy         "no-referrer"      always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Block docs in prod (FastAPI already gates this, belt-and-suspenders)
    location ~ ^/(docs|redoc|openapi.json) {
        deny all;
    }
}
